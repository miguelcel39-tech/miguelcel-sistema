<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiguelCel Tecnologia Digital | Gestión</title>
<style>
:root{--navy:#102b50;--blue:#1675d1;--sky:#eaf4ff;--ink:#1b2a3a;--muted:#65758a;--line:#dce5ef;--bg:#f4f7fb;--white:#fff;--green:#138451;--red:#bd3d43;--amber:#a96908}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700}button.secondary{background:#e8f0f8;color:var(--navy)}button.small{padding:6px 9px;font-size:12px}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:22px}
.brand{font-size:18px;font-weight:700;margin-bottom:25px}.brand small{display:block;font-size:11px;opacity:.7;font-weight:400}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;color:#bcd3f2;text-align:left;padding:11px;border-radius:7px;font-weight:600}.nav button:hover,.nav button.active{background:rgba(255,255,255,.1);color:#fff}
.sidefoot{margin-top:40px;font-size:11px;opacity:.6;line-height:1.4}.main{display:flex;flex-direction:column}.top{background:var(--white);border-bottom:1px solid var(--line);padding:15px 25px;display:flex;justify-content:space-between;align-items:center}.content{padding:25px;flex:1}.panel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:999}.loginbox{background:var(--white);padding:30px;border-radius:14px;width:320px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}.stat{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:18px}.stat b{display:block;font-size:24px;margin-top:5px;color:var(--navy)}
table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted)}
input[type="text"], input[type="number"], select, textarea{width:100%;padding:10px;margin-top:5px;margin-bottom:15px;border:1px solid var(--line);border-radius:8px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><h2>MiguelCel Tecnologia Digital</h2><p class="muted">Ingresa con tu PIN de colaborador.</p><input id="loginPin" type="password" inputmode="numeric" maxlength="4" style="font-size:24px;letter-spacing:8px;text-align:center;width:100%;padding:12px;margin:15px 0;border:1px solid var(--line);border-radius:9px"><button onclick="login()" style="width:100%">Ingresar</button><p class="muted" style="margin-top:15px;font-size:12px">Primer ingreso: PIN administrador 1234. Cámbialo en Usuarios.</p></div></div>
<div class="shell"><aside class="side"><div class="brand">MIGUELCEL <small>TECNOLOGÍA DIGITAL</small></div><div class="nav" id="nav">
<button class="active" data-page="inicio" onclick="setPage('inicio')">🏠 Inicio</button>
<button data-page="servicios" onclick="setPage('servicios')">🛠 Taller / equipos</button>
<button data-page="ventas" onclick="setPage('ventas')">+ Ventas</button>
<button data-page="inventario" onclick="setPage('inventario')">📦 Inventario</button>
<button data-page="caja" onclick="setPage('caja')">💰 Caja</button>
<button data-page="reportes" onclick="setPage('reportes')">📊 Reportes</button>
<button data-page="usuarios" onclick="setPage('usuarios')">👥 Usuarios</button>
<button data-page="config" onclick="setPage('config')">⚙ Config</button></div><div class="sidefoot">Barrio El Carmelo · Frente a Abarrotes Zuluaga<br>301 778 8964 · 323 355 8078</div></aside>
<main class="main"><header class="top"><div class="topleft"><strong id="topTitle">Panel principal</strong><br><span id="today"></span></div><div class="topright">👤 <span id="who"></span> <button class="secondary small no-print" onclick="logout()">Salir</button></div></header>
<div class="content" id="content"></div></main></div>

<script>
const KEY='miguelcel_gestion_v1';let db=load();let currentUser=null;let page='inicio';
function fresh(){return {users:[{id:1,name:'Administrador',pin:'1234',role:'admin',active:true}],clients:[],repairs:[],products:[],sales:[],expenses:[],movements:[],next:{client:1,repair:1,product:1,sale:1,expense:1,movement:1}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '$'+Number(n||0).toLocaleString('es-CO')}
function login(){let pin=document.getElementById('loginPin').value;let u=db.users.find(x=>x.active&&x.pin===pin);if(!u){alert('PIN incorrecto');return}currentUser=u;document.getElementById('login').style.display='none';renderApp()}
function logout(){currentUser=null;document.getElementById('login').style.display='flex';document.getElementById('loginPin').value='';}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));renderPage()}
function renderApp(){document.getElementById('who').textContent=currentUser.name;document.getElementById('today').textContent=new Date().toLocaleDateString('es-CO',{weekday:'long',year:'numeric',month:'long',day:'numeric'});renderPage()}

function renderPage(){
  let titles={inicio:'Panel principal',servicios:'Control de Taller y Equipos',ventas:'Registro de Ventas',inventario:'Control de Inventario',caja:'Caja y Movimientos',reportes:'Reportes Financieros',usuarios:'Gestión de Usuarios',config:'Configuración del Sistema'};
  document.getElementById('topTitle').textContent=titles[page]||'Panel';
  let c=document.getElementById('content');
  
  if(page==='inicio'){
    let totalVentas=db.sales.reduce((a,b)=>a+Number(b.total||0),0);
    c.innerHTML=`<div class="cards"><div class="stat">Ventas totales<b>${money(totalVentas)}</b></div><div class="stat">Equipos en taller<b>${db.repairs.length}</b></div><div class="stat">Productos en stock<b>${db.products.length}</b></div></div><div class="panel"><h3>Bienvenido al sistema</h3><p>Usa el menú lateral para registrar ventas, equipos, inventario y caja.</p></div>`;
  } else if(page==='inventario'){
    let rows = db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>$${p.cost}</td><td>$${p.price}</td><td>${p.stock}</td></tr>`).join('');
    c.innerHTML=`<div class="panel"><h3>Agregar Nuevo Producto</h3>
    <label>Nombre del producto:</label><input id="pName" type="text" placeholder="Ej: Cargador Tipo C">
    <div class="formgrid"><div><label>Costo ($):</label><input id="pCost" type="number" placeholder="0"></div><div><label>Precio Venta ($):</label><input id="pPrice" type="number" placeholder="0"></div></div>
    <label>Cantidad en Stock:</label><input id="pStock" type="number" placeholder="1">
    <button onclick="addProduct()">Guardar Producto</button></div>
    <div class="panel"><h3>Inventario Actual</h3><table><tr><th>Producto</th><th>Costo</th><th>Precio</th><th>Stock</th></tr>${rows||'<tr><td colspan="4">No hay productos registrados.</td></tr>'}</table></div>`;
  } else if(page==='ventas'){
    let rows = db.sales.map(s=>`<tr><td>${s.date||''}</td><td>${esc(s.client)}</td><td>${esc(s.product)}</td><td>${money(s.total)}</td></tr>`).join('');
    c.innerHTML=`<div class="panel"><h3>Registrar Nueva Venta</h3>
    <label>Nombre del Cliente:</label><input id="sClient" type="text" placeholder="Nombre del cliente">
    <label>Producto o Servicio:</label><input id="sProduct" type="text" placeholder="Ej: Pantalla A38">
    <div class="formgrid"><div><label>Cantidad:</label><input id="sQty" type="number" value="1"></div><div><label>Total Cobrado ($):</label><input id="sTotal" type="number" placeholder="0"></div></div>
    <button onclick="addSale()">Registrar Venta</button></div>
    <div class="panel"><h3>Historial de Ventas</h3><table><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Total</th></tr>${rows||'<tr><td colspan="4">No hay ventas registradas.</td></tr>'}</table></div>`;
  } else if(page==='servicios'){
    let rows = db.repairs.map(r=>`<tr><td>${esc(r.client)}</td><td>${esc(r.device)}</td><td>${esc(r.fault)}</td><td>${r.status||'Recibido'}</td></tr>`).join('');
    c.innerHTML=`<div class="panel"><h3>Recibir Equipo en Taller</h3>
    <label>Cliente:</label><input id="rClient" type="text" placeholder="Nombre del cliente">
    <label>Equipo / Modelo:</label><input id="rDevice" type="text" placeholder="Ej: Redmi Note 13">
    <label>Falla / Motivo:</label><textarea id="rFault" placeholder="Descripción del daño"></textarea>
    <button onclick="addRepair()">Guardar Orden de Taller</button></div>
    <div class="panel"><h3>Equipos en Taller</h3><table><tr><th>Cliente</th><th>Equipo</th><th>Falla</th><th>Estado</th></tr>${rows||'<tr><td colspan="4">No hay equipos en taller.</td></tr>'}</table></div>`;
  } else if(page==='usuarios'){
    let rows = db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.pin}</td><td>${u.role}</td></tr>`).join('');
    c.innerHTML=`<div class="panel"><h3>Usuarios del Sistema</h3><table><tr><th>Nombre</th><th>PIN</th><th>Rol</th></tr>${rows}</table></div>`;
  } else {
    c.innerHTML=`<div class="panel"><h3>${titles[page]}</h3><p>Módulo activo y listo.</p></div>`;
  }
}

function addProduct(){
  let name=document.getElementById('pName').value.trim();
  let cost=Number(document.getElementById('pCost').value);
  let price=Number(document.getElementById('pPrice').value);
  let stock=Number(document.getElementById('pStock').value);
  if(!name){alert('Escribe el nombre del producto');return;}
  db.products.push({id:db.next.product++, name, cost, price, stock});
  save(); renderPage(); alert('¡Producto agregado con éxito!');
}

function addSale(){
  let client=document.getElementById('sClient').value.trim()||'Mostrador';
  let product=document.getElementById('sProduct').value.trim();
  let qty=Number(document.getElementById('sQty').value)||1;
  let total=Number(document.getElementById('sTotal').value);
  if(!product){alert('Escribe el producto');return;}
  db.sales.push({id:db.next.sale++, client, product, qty, total, date:new Date().toLocaleDateString('es-CO')});
  save(); renderPage(); alert('¡Venta registrada con éxito!');
}

function addRepair(){
  let client=document.getElementById('rClient').value.trim();
  let device=document.getElementById('rDevice').value.trim();
  let fault=document.getElementById('rFault').value.trim();
  if(!client || !device){alert('Completa el cliente y el equipo');return;}
  db.repairs.push({id:db.next.repair++, client, device, fault, status:'En taller'});
  save(); renderPage(); alert('¡Equipo registrado en taller!');
}
</script>
