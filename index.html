<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiguelCel Tecnología Digital | Gestión</title>
<style>
:root{--navy:#102b50;--blue:#1675d1;--sky:#eaf4ff;--ink:#1b2a3a;--muted:#65758a;--line:#dce5ef;--bg:#f4f7fb;--white:#fff;--green:#138451;--red:#bd3d43;--amber:#a96908}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700}button.secondary{background:#e8f0f8;color:var(--navy)}button.danger{background:#fff0f0;color:var(--red)}button.small{padding:6px 9px;font-size:12px}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:20px;line-height:1.2;margin:4px 8px 4px}.brand small{display:block;font-size:11px;color:#a9d2ff;letter-spacing:1px;margin-top:6px}.nav{display:grid;gap:6px;margin-top:28px}.nav button{background:transparent;color:#dcecff;text-align:left;font-weight:600}.nav button.active,.nav button:hover{background:#1d4778;color:#fff}.sidefoot{position:absolute;bottom:18px;left:18px;right:18px;font-size:11px;color:#b5c9df;line-height:1.5}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top strong{font-size:17px}.top span{color:var(--muted);font-size:12px}.content{padding:24px;max-width:1400px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.pagehead h1{margin:0;font-size:24px;color:var(--navy)}.sub{color:var(--muted);font-size:13px;margin-top:5px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 2px 8px #102b5008}.stat label{color:var(--muted);font-size:12px}.stat b{display:block;font-size:24px;color:var(--navy);margin-top:8px}.stat small{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel h3{margin:0 0 14px;color:var(--navy);font-size:16px}.actions{display:flex;flex-wrap:wrap;gap:8px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#4f6074;font-weight:700}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:10px 11px;border:1px solid #ccd8e5;border-radius:8px;background:#fff;color:var(--ink);min-width:0}.field textarea{min-height:74px;resize:vertical}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input{max-width:300px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:650px;background:#fff}th,td{padding:11px 10px;border-bottom:1px solid #e8eef5;text-align:left;font-size:12px;vertical-align:top}th{background:#f1f6fb;color:#41546b;white-space:nowrap}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#eaf4ff;color:#135b9d;font-size:11px;font-weight:700}.muted{color:var(--muted)}.empty{text-align:center;padding:24px;color:var(--muted)}.notice{background:#fff8e8;border:1px solid #f0d8a8;color:#76500b;padding:12px;border-radius:10px;font-size:12px;line-height:1.5;margin:12px 0}.hidden{display:none!important}.login{position:fixed;inset:0;background:#0b203b;display:grid;place-items:center;padding:20px;z-index:10}.loginbox{background:#fff;border-radius:16px;padding:28px;width:min(390px,100%)}.loginbox h2{color:var(--navy);margin-top:0}.loginbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;margin:10px 0}.toast{position:fixed;bottom:18px;right:18px;background:#143b67;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:20}.tag{font-size:11px;color:var(--muted)}.right{text-align:right}.footer-note{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.5}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative;padding:13px}.brand{font-size:17px}.nav{display:flex;overflow:auto;margin-top:12px}.nav button{white-space:nowrap;padding:8px 10px}.sidefoot{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:15px}.top{padding:12px 15px}.grid2{grid-template-columns:1fr}}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.stat{padding:12px}.stat b{font-size:19px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.pagehead{align-items:flex-start;flex-direction:column}}
@media print{.side,.top,.no-print,button{display:none!important}.shell{display:block}.content{padding:0}.panel,.stat{box-shadow:none;border:0}body{background:#fff}}
</style></head>
<body>
<div id="login" class="login"><div class="loginbox"><h2>MiguelCel Tecnología Digital</h2><p class="muted">Ingresa con tu PIN de colaborador.</p><input id="loginPin" type="password" inputmode="numeric" placeholder="PIN"><button style="width:100%" onclick="login()">Ingresar</button><p class="tag">Primer ingreso: PIN administrador 1234. Cámbialo en Usuarios.</p></div></div>
<div class="shell"><aside class="side"><div class="brand">MIGUELCEL<small>TECNOLOGÍA DIGITAL</small></div><div class="nav" id="nav">
<button class="active" data-page="inicio">▦ Inicio</button><button data-page="servicios">▣ Taller / equipos</button><button data-page="ventas">＋ Ventas</button><button data-page="inventario">▤ Inventario</button><button data-page="clientes">♙ Clientes</button><button data-page="caja">＄ Caja y gastos</button><button data-page="reportes">▥ Cortes y reportes</button><button data-page="usuarios">⚙ Usuarios</button>
</div><div class="sidefoot">Barrio El Carmelo · Frente a Abarrotes Zuluaga<br>301 778 8964 · 323 355 8070</div></aside>
<main class="main"><header class="top"><div><strong id="topTitle">Panel principal</strong><br><span id="today"></span></div><div><span id="who"></span> <button class="secondary small no-print" onclick="logout()">Salir</button></div></header><div class="content" id="app"></div></main></div><div id="toast" class="toast"></div>
<script>
const KEY='miguelcel_gestion_v1';let db=load();let currentUser=null;let page='inicio';let editing=null;
function fresh(){return {users:[{id:1,name:'Administrador',pin:'1234',role:'admin',active:true}],clients:[],repairs:[],products:[],sales:[],expenses:[],movements:[],next:{client:1,repair:1,product:1,sale:1,expense:1,user:2}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '$'+Number(n||0).toLocaleString('es-CO',{maximumFractionDigits:0})}function dateNow(){return new Date().toISOString().slice(0,10)}function dateLabel(d){return d?new Date(d+'T12:00:00').toLocaleDateString('es-CO'):'—'}function id(k){return db.next[k]++}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}function isAdmin(){return currentUser?.role==='admin'}function allowed(p){return isAdmin()||['inicio','servicios','ventas','inventario','clientes','caja','reportes'].includes(p)}
function login(){let pin=document.getElementById('loginPin').value;let u=db.users.find(x=>x.active&&x.pin===pin);if(!u){toast('PIN incorrecto');return}currentUser=u;document.getElementById('login').classList.add('hidden');document.getElementById('who').textContent=u.name+(u.role==='admin'?' · Administrador':' · Vendedor');render()}
function logout(){currentUser=null;document.getElementById('login').classList.remove('hidden');document.getElementById('loginPin').value=''}
document.getElementById('loginPin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});document.getElementById('today').textContent=new Date().toLocaleDateString('es-CO',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));
function go(p){page=p;render()}function setTitle(t){document.getElementById('topTitle').textContent=t}function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(!isAdmin())document.querySelector('[data-page="usuarios"]').classList.add('hidden');else document.querySelector('[data-page="usuarios"]').classList.remove('hidden');let titles={inicio:'Panel principal',servicios:'Taller y equipos',ventas:'Punto de venta',inventario:'Inventario',clientes:'Clientes',caja:'Caja y gastos',reportes:'Cortes y reportes',usuarios:'Usuarios y permisos'};setTitle(titles[page]);if(!allowed(page))page='inicio';document.getElementById('app').innerHTML=({inicio:home,servicios:repairsPage,ventas:salesPage,inventario:inventoryPage,clientes:clientsPage,caja:cashPage,reportes:reportsPage,usuarios:usersPage}[page])();}
function sum(a,f){return a.reduce((s,x)=>s+f(x),0)}function todaySales(){return db.sales.filter(x=>x.date===dateNow())}function home(){let day=todaySales(),month=db.sales.filter(x=>x.date.slice(0,7)===dateNow().slice(0,7));let pending=db.repairs.filter(x=>x.status!=='Entregado');let balance=sum(db.repairs,x=>Math.max(0,x.price-x.paid));let top=[...db.products].sort((a,b)=>b.sold-a.sold).slice(0,5);return `<div class="pagehead"><div><h1>Bienvenido a MiguelCel</h1><div class="sub">Control sencillo de ventas, reparaciones, inventario y dinero.</div></div><div class="actions no-print"><button onclick="go('servicios')">＋ Recibir equipo</button><button onclick="go('ventas')">＋ Nueva venta</button></div></div><div class="cards"><div class="stat"><label>Ventas de hoy</label><b>${money(sum(day,x=>x.total))}</b><small>${day.length} ventas registradas</small></div><div class="stat"><label>Ventas del mes</label><b>${money(sum(month,x=>x.total))}</b><small>${month.length} operaciones</small></div><div class="stat"><label>Equipos en taller</label><b>${pending.length}</b><small>Órdenes sin entregar</small></div><div class="stat"><label>Saldo pendiente taller</label><b>${money(balance)}</b><small>Por cobrar en reparaciones</small></div></div><div class="grid2"><section class="panel"><h3>Accesos rápidos</h3><div class="actions"><button onclick="go('servicios')">Registrar reparación</button><button onclick="go('ventas')">Registrar venta</button><button class="secondary" onclick="go('inventario')">Agregar inventario</button><button class="secondary" onclick="go('caja')">Registrar gasto</button></div><p class="footer-note">Cada venta de un producto del inventario descuenta automáticamente las unidades vendidas. Los abonos se suman al historial de cada orden.</p></section><section class="panel"><h3>Productos más vendidos</h3>${top.length?`<table><tr><th>Producto</th><th>Unidades vendidas</th></tr>${top.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.sold||0}</td></tr>`).join('')}</table>`:'<div class="empty">Aún no hay ventas de productos inventariados.</div>'}</section></div><div class="notice">Consejo: realiza una copia de seguridad al terminar cada jornada desde Cortes y reportes. Este programa guarda los datos en este navegador y dispositivo.</div>`}
function clientOptions(){return db.clients.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.phone)}</option>`).join('')}
function repairsPage(){return `<div class="pagehead"><div><h1>Ingreso de equipo al taller</h1><div class="sub">Registra los datos del cliente y del equipo. El cliente nuevo se crea al guardar.</div></div></div><section class="panel"><form id="repairForm" onsubmit="saveRepair(event)"><div class="formgrid"><div class="field"><label>Nombre del cliente *</label><input name="name" required placeholder="Nombre y apellido"></div><div class="field"><label>Celular del cliente *</label><input name="phone" required inputmode="tel" placeholder="Número de contacto"></div><div class="field"><label>Tipo de equipo</label><select name="device"><option>Celular</option><option>Computador</option><option>Tablet</option><option>Televisor</option><option>Otro</option></select></div><div class="field"><label>Marca</label><input name="brand" placeholder="Samsung, Xiaomi, HP..."></div><div class="field"><label>Modelo</label><input name="model" placeholder="Modelo del equipo"></div><div class="field"><label>IMEI / Serial</label><input name="imei" placeholder="IMEI o número de serie"></div><div class="field"><label>Daño reportado *</label><input name="damage" required placeholder="Describe la falla que informa el cliente"></div><div class="field"><label>Valor acordado / cotización ($)</label><input name="price" type="number" min="0" value="0"></div><div class="field"><label>Abono inicial ($)</label><input name="paid" type="number" min="0" value="0"></div><div class="field"><label>Estado</label><select name="status"><option>Recibido</option><option>En diagnóstico</option><option>En reparación</option><option>Listo para entregar</option><option>Entregado</option><option>Sin reparación</option></select></div><div class="field full"><label>Observaciones / accesorios recibidos</label><textarea name="notes" placeholder="Estado físico, cargador, sim, detalles importantes..."></textarea></div><div class="field full"><label><input type="checkbox" name="authorized" style="width:auto"> El cliente autoriza pruebas técnicas del equipo.</label></div></div><div class="notice">Privacidad: no guardes el PIN, contraseña ni patrón real de desbloqueo en el sistema ni en la factura. Pide al cliente que desbloquee el equipo cuando sea necesario y registra únicamente su autorización.</div><div class="actions"><button type="submit">Guardar orden de servicio</button><button type="reset" class="secondary">Limpiar</button></div></form></section><section class="panel" style="margin-top:16px"><h3>Órdenes de servicio</h3><div class="toolbar"><input id="repairSearch" placeholder="Buscar cliente, teléfono, modelo o IMEI" oninput="renderRepairRows()"><select id="repairFilter" onchange="renderRepairRows()"><option value="">Todos los estados</option>${['Recibido','En diagnóstico','En reparación','Listo para entregar','Entregado','Sin reparación'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="repairRows"></div></section>`}
function saveRepair(e){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),phone=f.get('phone').trim();let c=db.clients.find(x=>x.phone===phone)||{id:id('client'),name,phone};c.name=name;c.phone=phone;if(!db.clients.some(x=>x.id===c.id))db.clients.push(c);let price=+f.get('price')||0,paid=+f.get('paid')||0;let r={id:id('repair'),date:dateNow(),clientId:c.id,name,phone,device:f.get('device'),brand:f.get('brand'),model:f.get('model'),imei:f.get('imei'),damage:f.get('damage'),price,paid,status:f.get('status'),notes:f.get('notes'),authorized:f.get('authorized')==='on',payments:paid?[{date:dateNow(),amount:paid,note:'Abono inicial'}]:[]};db.repairs.unshift(r);save();e.target.reset();toast('Orden #'+r.id+' guardada');render()}
function renderRepairRows(){let q=(document.getElementById('repairSearch')?.value||'').toLowerCase(),st=document.getElementById('repairFilter')?.value||'';let arr=db.repairs.filter(r=>(!st||r.status===st)&&[r.name,r.phone,r.model,r.imei,r.brand].join(' ').toLowerCase().includes(q));document.getElementById('repairRows').innerHTML=arr.length?`<div class="tablewrap"><table><tr><th>Orden</th><th>Fecha</th><th>Cliente / contacto</th><th>Equipo</th><th>Daño</th><th>Valor</th><th>Abonado</th><th>Saldo</th><th>Estado</th><th>Acciones</th></tr>${arr.map(r=>`<tr><td>#${r.id}</td><td>${dateLabel(r.date)}</td><td>${esc(r.name)}<br>${esc(r.phone)}</td><td>${esc(r.brand)} ${esc(r.model)}<br><span class="tag">${esc(r.imei)}</span></td><td>${esc(r.damage)}</td><td>${money(r.price)}</td><td>${money(r.paid)}</td><td><b>${money(r.price-r.paid)}</b></td><td><span class="pill">${esc(r.status)}</span></td><td><button class="small" onclick="repairDetail(${r.id})">Ver / abonar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No hay órdenes que coincidan.</div>'}
function repairDetail(idv){let r=db.repairs.find(x=>x.id===idv);let a=prompt(`ORDEN #${r.id}\n${r.name} · ${r.phone}\n${r.brand} ${r.model} · ${r.damage}\nValor: ${money(r.price)} | Abonado: ${money(r.paid)} | Saldo: ${money(r.price-r.paid)}\nEstado actual: ${r.status}\n\nEscribe: 1 para agregar abono, 2 para cambiar estado, 3 para imprimir comprobante, 4 para editar observación, 5 para eliminar orden.`);if(a==='1'){let n=+prompt('Valor del abono ($):');if(n>0){r.paid+=n;r.payments.push({date:dateNow(),amount:n,note:'Abono'});save();toast('Abono registrado');render()}}else if(a==='2'){let s=prompt('Estado: Recibido / En diagnóstico / En reparación / Listo para entregar / Entregado / Sin reparación',r.status);if(['Recibido','En diagnóstico','En reparación','Listo para entregar','Entregado','Sin reparación'].includes(s)){r.status=s;save();render()}}else if(a==='3')printRepair(r);else if(a==='4'){r.notes=prompt('Observaciones:',r.notes)||r.notes;save();render()}else if(a==='5'&&isAdmin()&&confirm('¿Eliminar esta orden?')){db.repairs=db.repairs.filter(x=>x.id!==idv);save();render()}}
function printRepair(r){let w=window.open('','_blank');w.document.write(`<html><meta charset="utf-8"><title>Orden ${r.id}</title><body style="font-family:Arial;padding:25px"><h2>MIGUELCEL TECNOLOGÍA DIGITAL</h2><p>Barrio El Carmelo · Frente a Abarrotes Zuluaga<br>301 778 8964 · 323 355 8070</p><hr><h3>Orden de servicio #${r.id}</h3><p>Fecha: ${dateLabel(r.date)}</p><p>Cliente: ${esc(r.name)} · ${esc(r.phone)}</p><p>Equipo: ${esc(r.device)} ${esc(r.brand)} ${esc(r.model)}<br>IMEI/Serial: ${esc(r.imei)}</p><p>Daño reportado: ${esc(r.damage)}</p><p>Estado: ${esc(r.status)}</p><p>Observaciones: ${esc(r.notes)}</p><p>Valor: ${money(r.price)} · Abonado: ${money(r.paid)} · Saldo: ${money(r.price-r.paid)}</p><hr><p>Gracias por confiar en MiguelCel.</p><script>window.print()<\/script></body></html>`);w.document.close()}
function salesPage(){return `<div class="pagehead"><div><h1>Nueva venta</h1><div class="sub">Vende productos del inventario o registra un artículo ocasional.</div></div></div><section class="panel"><form id="saleForm" onsubmit="saveSale(event)"><div class="formgrid"><div class="field"><label>Cliente (opcional)</label><input name="clientName" placeholder="Nombre del cliente"></div><div class="field"><label>Celular del cliente (opcional)</label><input name="clientPhone" placeholder="Número de contacto"></div><div class="field"><label>Producto</label><select name="productId" id="saleProduct" onchange="productSelected()"><option value="">Agregar producto nuevo / no inventariado</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} · Stock ${p.stock} · ${money(p.price)}</option>`).join('')}</select></div><div class="field"><label>Nombre del artículo (si es nuevo)</label><input name="newName" id="newName" placeholder="Nombre del producto o servicio"></div><div class="field"><label>Cantidad</label><input name="qty" type="number" min="1" value="1" required></div><div class="field"><label>Precio de venta unitario ($)</label><input name="price" id="salePrice" type="number" min="0" value="0" required></div><div class="field"><label>Costo unitario ($) (para calcular utilidad)</label><input name="cost" id="saleCost" type="number" min="0" value="0"></div><div class="field"><label>Forma de pago</label><select name="method"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Crédito / pendiente</option><option>Otro</option></select></div><div class="field full"><label>Observaciones</label><input name="notes" placeholder="Detalle de la venta, financiera, referencia, etc."></div><div class="field full"><label><input type="checkbox" name="addStock" style="width:auto"> Si es un artículo nuevo, agregarlo también al inventario con cantidad inicial igual a la vendida.</label></div><div class="field full"><label><input type="checkbox" name="wa" style="width:auto"> Autorizo abrir WhatsApp para compartir el comprobante con el cliente.</label></div></div><div class="actions" style="margin-top:14px"><button type="submit">Registrar venta y generar factura</button><button type="reset" class="secondary">Limpiar</button></div></form></section><section class="panel" style="margin-top:16px"><h3>Ventas recientes</h3><div id="saleRows"></div></section>`}
function productSelected(){let idv=+document.getElementById('saleProduct').value,p=db.products.find(x=>x.id===idv);if(p){document.getElementById('newName').value=p.name;document.getElementById('salePrice').value=p.price;document.getElementById('saleCost').value=p.cost}else{document.getElementById('newName').value='';document.getElementById('salePrice').value=0;document.getElementById('saleCost').value=0}}
function saveSale(e){e.preventDefault();let f=new FormData(e.target),pid=+f.get('productId'),p=db.products.find(x=>x.id===pid),qty=Math.max(1,+f.get('qty')),name=p?.name||f.get('newName').trim(),price=+f.get('price'),cost=+f.get('cost');if(!name){toast('Escribe el nombre del producto');return}if(p&&p.stock<qty){toast('No hay unidades suficientes en inventario');return}let phone=f.get('clientPhone').trim(),cn=f.get('clientName').trim();if(phone&&cn){let c=db.clients.find(x=>x.phone===phone)||{id:id('client'),name:cn,phone};c.name=cn;if(!db.clients.some(x=>x.id===c.id))db.clients.push(c)}if(p){p.stock-=qty;p.sold=(p.sold||0)+qty;db.movements.push({date:dateNow(),productId:p.id,type:'Salida por venta',qty,note:'Venta'})}else if(f.get('addStock')==='on'){p={id:id('product'),name,category:'Venta ocasional',stock:0,cost,price,sold:qty};db.products.push(p);p.stock=0;db.movements.push({date:dateNow(),productId:p.id,type:'Venta artículo nuevo',qty,note:'Artículo creado desde venta'})}let sale={id:id('sale'),date:dateNow(),name,qty,price,cost,total:price*qty,profit:(price-cost)*qty,clientName:cn,clientPhone:phone,method:f.get('method'),notes:f.get('notes'),productId:p?.id||null};db.sales.unshift(sale);save();e.target.reset();render();if(f.get('wa')==='on'&&phone){let msg=`MiguelCel Tecnología Digital\nComprobante de venta #${sale.id}\nProducto: ${name}\nCantidad: ${qty}\nTotal: ${money(sale.total)}\nPago: ${sale.method}\nGracias por su compra.`;window.open('https://wa.me/57'+phone.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}else printSale(sale);toast('Venta registrada')}
function printSale(s){let w=window.open('','_blank');w.document.write(`<html><meta charset="utf-8"><body style="font-family:Arial;padding:24px"><h2>MIGUELCEL TECNOLOGÍA DIGITAL</h2><p>Barrio El Carmelo · Frente a Abarrotes Zuluaga<br>301 778 8964 · 323 355 8070</p><hr><h3>Comprobante de venta #${s.id}</h3><p>Fecha: ${dateLabel(s.date)}<br>Cliente: ${esc(s.clientName||'Venta de mostrador')} ${esc(s.clientPhone||'')}</p><p>${esc(s.name)} × ${s.qty}<br>Valor unitario: ${money(s.price)}</p><h2>Total: ${money(s.total)}</h2><p>Forma de pago: ${esc(s.method)}<br>${esc(s.notes)}</p><hr>Gracias por su compra.<script>window.print()<\/script></body></html>`);w.document.close()}
function inventoryPage(){return `<div class="pagehead"><div><h1>Inventario</h1><div class="sub">Registra entradas, salidas, costos, precios y existencias.</div></div></div><section class="panel"><h3>Agregar producto / entrada de mercancía</h3><form onsubmit="addProduct(event)"><div class="formgrid"><div class="field"><label>Nombre del producto *</label><input name="name" required placeholder="Cargador tipo C, forro... "></div><div class="field"><label>Categoría</label><select name="category"><option>Accesorios</option><option>Repuestos</option><option>Celulares</option><option>Computadores</option><option>Otros</option></select></div><div class="field"><label>Cantidad que ingresa</label><input name="stock" type="number" min="0" value="0"></div><div class="field"><label>Costo unitario ($)</label><input name="cost" type="number" min="0" value="0"></div><div class="field"><label>Precio de venta ($)</label><input name="price" type="number" min="0" value="0"></div><div class="field"><label>Referencia / código</label><input name="sku" placeholder="Opcional"></div></div><div class="actions" style="margin-top:12px"><button>Guardar producto / entrada</button></div></form></section><section class="panel" style="margin-top:16px"><h3>Existencias</h3><div class="toolbar"><input id="invSearch" placeholder="Buscar producto" oninput="renderInvRows()"><button class="secondary" onclick="manualMovement()">Registrar salida / ajuste</button></div><div id="invRows"></div></section>`}
function addProduct(e){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),stock=+f.get('stock'),p=db.products.find(x=>x.name.toLowerCase()===name.toLowerCase());if(p){p.stock+=stock;p.cost=+f.get('cost');p.price=+f.get('price');p.category=f.get('category')}else{p={id:id('product'),name,category:f.get('category'),stock,cost:+f.get('cost'),price:+f.get('price'),sku:f.get('sku'),sold:0};db.products.push(p)}db.movements.push({date:dateNow(),productId:p.id,type:'Entrada',qty:stock,note:'Ingreso de inventario'});save();e.target.reset();render();toast('Inventario actualizado')}
function renderInvRows(){let q=(document.getElementById('invSearch')?.value||'').toLowerCase(),arr=db.products.filter(p=>p.name.toLowerCase().includes(q));document.getElementById('invRows').innerHTML=arr.length?`<div class="tablewrap"><table><tr><th>Producto</th><th>Categoría</th><th>Stock</th><th>Costo</th><th>Precio</th><th>Utilidad unitaria</th><th>Acción</th></tr>${arr.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td><b>${p.stock}</b></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(p.price-p.cost)}</td><td><button class="small secondary" onclick="editProduct(${p.id})">Editar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No hay productos en el inventario.</div>'}
function editProduct(idv){let p=db.products.find(x=>x.id===idv),name=prompt('Nombre:',p.name);if(name===null)return;let stock=prompt('Existencias actuales:',p.stock);let cost=prompt('Costo unitario:',p.cost);let price=prompt('Precio de venta:',p.price);p.name=name;p.stock=Math.max(0,+stock||0);p.cost=+cost||0;p.price=+price||0;save();render()}
function manualMovement(){let name=prompt('Escribe el nombre exacto del producto:');let p=db.products.find(x=>x.name.toLowerCase()===String(name).toLowerCase());if(!p){toast('Producto no encontrado');return}let n=+prompt('Cantidad que sale (usa número positivo):');if(n>0&&n<=p.stock){p.stock-=n;db.movements.push({date:dateNow(),productId:p.id,type:'Salida / ajuste',qty:n,note:'Salida manual'});save();render()}else toast('Cantidad inválida o stock insuficiente')}
function clientsPage(){return `<div class="pagehead"><div><h1>Clientes</h1><div class="sub">Los clientes se crean automáticamente al recibir un equipo o registrar una venta con sus datos.</div></div><button onclick="newClient()">＋ Agregar cliente</button></div><section class="panel"><div class="toolbar"><input id="clientSearch" placeholder="Buscar por nombre o teléfono" oninput="renderClientRows()"></div><div id="clientRows"></div></section>`}
function newClient(){let name=prompt('Nombre del cliente:');if(!name)return;let phone=prompt('Celular:')||'';let old=db.clients.find(c=>phone&&c.phone===phone);if(old){old.name=name}else db.clients.push({id:id('client'),name,phone});save();render()}
function renderClientRows(){let q=(document.getElementById('clientSearch')?.value||'').toLowerCase(),arr=db.clients.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q));document.getElementById('clientRows').innerHTML=arr.length?`<div class="tablewrap"><table><tr><th>Cliente</th><th>Celular</th><th>Órdenes</th><th>Compras</th><th>Acciones</th></tr>${arr.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${db.repairs.filter(r=>r.clientId===c.id).length}</td><td>${db.sales.filter(s=>s.clientPhone===c.phone).length}</td><td><button class="small secondary" onclick="editClient(${c.id})">Editar</button> <button class="small danger" onclick="deleteClient(${c.id})">Borrar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Todavía no hay clientes.</div>'}
function editClient(idv){let c=db.clients.find(x=>x.id===idv);let n=prompt('Nombre:',c.name);if(n===null)return;let p=prompt('Celular:',c.phone);if(p===null)return;c.name=n;c.phone=p;save();render()}
function deleteClient(idv){if(!isAdmin()){toast('Solo administrador puede borrar clientes');return}if(!confirm('¿Borrar este cliente? Las órdenes y ventas históricas se conservan.'))return;db.clients=db.clients.filter(c=>c.id!==idv);save();render()}
function cashPage(){return `<div class="pagehead"><div><h1>Caja y gastos</h1><div class="sub">Registra gastos del negocio y consulta los movimientos de caja.</div></div></div><section class="panel"><h3>Registrar gasto</h3><form onsubmit="addExpense(event)"><div class="formgrid"><div class="field"><label>Concepto *</label><input name="concept" required placeholder="Arriendo, servicios, transporte..."></div><div class="field"><label>Valor ($) *</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Categoría</label><select name="category"><option>Local</option><option>Personal</option><option>Servicios públicos</option><option>Transporte</option><option>Mercancía / repuestos</option><option>Otro</option></select></div><div class="field"><label>Observación</label><input name="note"></div></div><div class="actions" style="margin-top:12px"><button>Guardar gasto</button></div></form></section><section class="panel" style="margin-top:16px"><h3>Gastos recientes</h3><div id="expenseRows"></div></section>`}
function addExpense(e){e.preventDefault();let f=new FormData(e.target);db.expenses.unshift({id:id('expense'),date:dateNow(),concept:f.get('concept'),amount:+f.get('amount'),category:f.get('category'),note:f.get('note')});save();e.target.reset();render();toast('Gasto registrado')}
function renderExpenseRows(){document.getElementById('expenseRows').innerHTML=db.expenses.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Valor</th><th>Observación</th></tr>${db.expenses.slice(0,100).map(x=>`<tr><td>${dateLabel(x.date)}</td><td>${esc(x.concept)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div>`:'<div class="empty">No hay gastos registrados.</div>'}
function usersPage(){if(!isAdmin())return '<div class="notice">Solo el administrador puede gestionar usuarios.</div>';return `<div class="pagehead"><div><h1>Usuarios y permisos</h1><div class="sub">Crea colaboradores con PIN y asigna el perfil de vendedor.</div></div></div><section class="panel"><h3>Agregar colaborador</h3><form onsubmit="addUser(event)"><div class="formgrid"><div class="field"><label>Nombre *</label><input name="name" required></div><div class="field"><label>PIN numérico *</label><input name="pin" required minlength="4" maxlength="8" pattern="[0-9]{4,8}" inputmode="numeric"></div><div class="field"><label>Permiso</label><select name="role"><option value="seller">Vendedor</option><option value="admin">Administrador</option></select></div></div><div class="actions" style="margin-top:12px"><button>Crear usuario</button></div></form></section><section class="panel" style="margin-top:16px"><h3>Usuarios activos</h3><div class="tablewrap"><table><tr><th>Nombre</th><th>Rol</th><th>Estado</th><th>Acción</th></tr>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.role==='admin'?'Administrador':'Vendedor'}</td><td>${u.active?'Activo':'Inactivo'}</td><td>${u.id===currentUser.id?'Sesión actual':`<button class="small secondary" onclick="toggleUser(${u.id})">${u.active?'Desactivar':'Activar'}</button> <button class="small secondary" onclick="changePin(${u.id})">Cambiar PIN</button>`}</td></tr>`).join('')}</table></div><div class="notice">Seguridad básica: el PIN es para identificar al colaborador en este dispositivo, no reemplaza una cuenta segura en la nube. No compartas el PIN administrador.</div><button class="secondary" onclick="changePin(${currentUser.id})">Cambiar mi PIN</button></section>`}
function addUser(e){e.preventDefault();let f=new FormData(e.target),pin=f.get('pin');if(db.users.some(u=>u.pin===pin)){toast('Ese PIN ya está en uso');return}db.users.push({id:id('user'),name:f.get('name'),pin,role:f.get('role'),active:true});save();render();toast('Colaborador creado')}
function toggleUser(idv){let u=db.users.find(x=>x.id===idv);u.active=!u.active;save();render()}function changePin(idv){let u=db.users.find(x=>x.id===idv),p=prompt('Nuevo PIN de 4 a 8 números:');if(!p)return;if(!/^\d{4,8}$/.test(p)||db.users.some(x=>x.id!==idv&&x.pin===p)){toast('PIN inválido o repetido');return}u.pin=p;save();toast('PIN actualizado')}
function reportsPage(){return `<div class="pagehead"><div><h1>Cortes y reportes</h1><div class="sub">Consulta el movimiento de ventas, utilidad estimada, gastos y abonos.</div></div></div><section class="panel"><div class="toolbar"><select id="period" onchange="reportRows()"><option value="day">Hoy</option><option value="week">Esta semana</option><option value="month" selected>Este mes</option><option value="quarter">Este trimestre</option><option value="half">Este semestre</option><option value="year">Este año</option><option value="all">Todo</option></select><input id="fromDate" type="date" onchange="reportRows()"><input id="toDate" type="date" onchange="reportRows()"><button class="secondary" onclick="backup()">Descargar copia de seguridad</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Restaurar copia</button><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="restore(event)"></div><div id="reportContent"></div></section><section class="panel" style="margin-top:16px"><h3>Artículos más vendidos</h3><div id="bestRows"></div></section><div class="footer-note">La utilidad de ventas es una estimación: precio de venta menos costo unitario registrado. No incluye gastos generales ni impuestos. Los abonos de taller se muestran por separado para no confundirlos con ventas de mostrador.</div>`}
function getRange(){let p=document.getElementById('period')?.value||'month',now=new Date(),start=new Date(now),end=new Date(now);if(p==='day'){}else if(p==='week'){let day=(now.getDay()+6)%7;start.setDate(now.getDate()-day)}else if(p==='month')start.setDate(1);else if(p==='quarter'){start.setMonth(Math.floor(now.getMonth()/3)*3,1)}else if(p==='half'){start.setMonth(now.getMonth()<6?0:6,1)}else if(p==='year')start.setMonth(0,1);else if(p==='all')start=new Date('2000-01-01');let from=document.getElementById('fromDate')?.value,to=document.getElementById('toDate')?.value;return {from:from||start.toISOString().slice(0,10),to:to||end.toISOString().slice(0,10)}}
function reportRows(){let {from,to}=getRange(),within=x=>x>=from&&x<=to,sales=db.sales.filter(x=>within(x.date)),expenses=db.expenses.filter(x=>within(x.date)),payments=db.repairs.flatMap(r=>(r.payments||[]).map(p=>({...p,repairId:r.id}))).filter(x=>within(x.date));let gross=sum(sales,x=>x.total),profit=sum(sales,x=>x.profit),cost=sum(sales,x=>x.cost*x.qty),spent=sum(expenses,x=>x.amount),paid=sum(payments,x=>x.amount);document.getElementById('reportContent').innerHTML=`<div class="cards" style="margin-top:14px"><div class="stat"><label>Ventas</label><b>${money(gross)}</b><small>${sales.length} ventas</small></div><div class="stat"><label>Utilidad bruta estimada</label><b>${money(profit)}</b><small>Antes de gastos</small></div><div class="stat"><label>Gastos registrados</label><b>${money(spent)}</b><small>${expenses.length} gastos</small></div><div class="stat"><label>Abonos de taller</label><b>${money(paid)}</b><small>${payments.length} pagos</small></div></div><p><b>Rango:</b> ${dateLabel(from)} al ${dateLabel(to)} · <b>Costo de mercancía vendida:</b> ${money(cost)} · <b>Resultado estimado después de gastos:</b> ${money(profit-spent)}</p><div class="actions no-print"><button class="secondary" onclick="exportCSV('${from}','${to}')">Exportar ventas CSV</button><button class="secondary" onclick="window.print()">Imprimir corte</button></div>`;let best={};sales.forEach(s=>best[s.name]=(best[s.name]||0)+s.qty);let list=Object.entries(best).sort((a,b)=>b[1]-a[1]).slice(0,10);document.getElementById('bestRows').innerHTML=list.length?`<table><tr><th>Producto / servicio</th><th>Unidades</th></tr>${list.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('')}</table>`:'<div class="empty">No hay ventas en este período.</div>'}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='respaldo-miguelcel-'+dateNow()+'.json';a.click();URL.revokeObjectURL(a.href)}function restore(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!x.users||!x.sales||!x.products)throw 0;if(!confirm('Esto reemplazará los datos actuales de este navegador. ¿Continuar?'))return;db=x;save();toast('Copia restaurada');render()}catch(err){toast('Archivo de respaldo no válido')}};reader.readAsText(file)}
function exportCSV(from,to){let arr=db.sales.filter(s=>s.date>=from&&s.date<=to),rows=[['Fecha','Venta','Cliente','Telefono','Producto','Cantidad','Total','Costo','Utilidad','Pago'],...arr.map(s=>[s.date,s.id,s.clientName,s.clientPhone,s.name,s.qty,s.total,s.cost*s.qty,s.profit,s.method])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`miguelcel-ventas-${from}-${to}.csv`;a.click();URL.revokeObjectURL(a.href)}
// Render tables after the page template has been inserted.
const originalRender=render;render=function(){originalRender();if(page==='servicios')renderRepairRows();if(page==='ventas')renderSaleRows();if(page==='inventario')renderInvRows();if(page==='clientes')renderClientRows();if(page==='caja')renderExpenseRows();if(page==='reportes')reportRows()};
function renderSaleRows(){let arr=db.sales.slice(0,30);document.getElementById('saleRows').innerHTML=arr.length?`<div class="tablewrap"><table><tr><th>Fecha</th><th>Comprobante</th><th>Cliente</th><th>Producto</th><th>Total</th><th>Utilidad estimada</th><th>Acción</th></tr>${arr.map(s=>`<tr><td>${dateLabel(s.date)}</td><td>#${s.id}</td><td>${esc(s.clientName||'Mostrador')}<br>${esc(s.clientPhone)}</td><td>${esc(s.name)} × ${s.qty}</td><td>${money(s.total)}</td><td>${money(s.profit)}</td><td><button class="small secondary" onclick="printSale(db.sales.find(x=>x.id===${s.id}))">Factura</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No hay ventas registradas.</div>'}
